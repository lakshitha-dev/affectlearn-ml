paths:
  # Google Drive paths (used in Colab after mounting Drive)
  daisee_zip: /content/drive/MyDrive/affectlearn-ml/data/DAiSEE.zip
  daisee_raw: /content/drive/MyDrive/affectlearn-ml/data/DAiSEE
  # Preprocessed goes to local Colab disk for fast I/O during training
  daisee_preprocessed: /content/daisee_preprocessed
  checkpoints: /content/drive/MyDrive/affectlearn-ml/models
  labels_dir: /content/drive/MyDrive/affectlearn-ml/data/DAiSEE/Labels
  # MediaPipe blaze_face_short_range.tflite cache. If absent it is auto-downloaded
  # from the same Google URL the browser loads at runtime. Put it on Drive so the
  # download is not repeated on every runtime reset.
  face_detector_model: /content/drive/MyDrive/affectlearn-ml/models/blaze_face_short_range.tflite

model:
  input_size: 96
  frames_per_clip: 16
  cnn_out_dim: 512
  hidden_size: 256
  num_layers: 1
  num_classes: 4          # 0=very low, 1=low, 2=high, 3=very high
  dropout: 0.5
  backbone: resnet18      # scratch | resnet18 (ImageNet-pretrained)

training:
  batch_size: 32          # 32 for T4, 64 for A100
  epochs: 40
  lr: 2.0e-4
  weight_decay: 1.0e-4
  focal_gamma: 2.0
  balanced_sampling: true        # WeightedRandomSampler (sqrt) to counter class imbalance
  freeze_backbone: true          # freeze ResNet18 except layer4 (anti-overfit)
  # freeze_backbone_full: true   # (optional) freeze entire backbone, train LSTM+head only
  # label_smoothing: 0.1         # (optional) extra regularisation
  early_stopping_patience: 12
  mixed_precision: true
  num_workers: 2

target_affect: Engagement  # Boredom | Engagement | Confusion | Frustration

# Binary collapse of the ordinal label. null keeps 4 levels.
#   any   {1,2,3} vs {0}   -- "was the state present at all"
#   high  {2,3}   vs {0,1} -- "was it present at intensity"
# `model.num_classes` is derived from this at runtime, so it does not need editing here.
# The cut is NOT cosmetic and must be reported with every metric: on Engagement the ANY cut
# leaves 4 negatives in the entire test split (accuracy 0.9969 against a 0.9976 baseline, and
# a negative kappa), while the HIGH cut leaves 85. See reports/facial_confusion/FINDINGS.md.
binary_cut: null
